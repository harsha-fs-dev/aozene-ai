# Application
spring.application.name=dubpilot-ai-backend
server.port=8080

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/dubpilot_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password= Google@10
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# AssemblyAI Voice Agent API (Step 10)
# Set the ASSEMBLYAI_API_KEY environment variable before starting the app.
# The raw key is never hard-coded here and never sent to the frontend.
assemblyai.api.key=${ASSEMBLYAI_API_KEY:}